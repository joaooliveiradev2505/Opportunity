name: Fintech Opportunity CI

on:
  push:
    branches: [ main, master, open_finance_bacen ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend (Java 21 + Spring Boot + JUnit 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests (JUnit 5 + Mockito)
        run: |
          chmod +x ./mvnw
          ./mvnw test -B

  frontend-build:
    name: Frontend (React 19 + Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build SPA
        run: |
          npm ci
          npm run build

  python-engine:
    name: Python Opportunity & AI Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Opportunity Cost CLI & JSON Output
        run: python3 python/motor_oportunidade_ia.py --json
