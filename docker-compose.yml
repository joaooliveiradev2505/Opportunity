services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintech-opportunity-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ORACLE_USER=${ORACLE_USER:-rm574426}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintech-opportunity-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
